name = "tribal-lands-discord-bot"
main = "src/worker.js"
compatibility_date = "2026-08-04"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "replace_with_cloudflare_kv_namespace_id"
preview_id = "replace_with_cloudflare_preview_kv_namespace_id"

[vars]
GAME_PROVIDER = "palworld"
POLLING_ENABLED = "true"
PALWORLD_HOST = "135.148.100.61"
PALWORLD_PORT = "25586"
PALWORLD_USERNAME = "admin"
SERVER_DISPLAY_NAME = "The Tribal Lands"
OFFLINE_FAILURE_THRESHOLD = "2"
STATUS_UPDATE_SECONDS = "60"
