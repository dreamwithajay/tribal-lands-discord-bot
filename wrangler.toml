name = "tribal-lands-discord-bot"
main = "src/worker.js"
compatibility_date = "2026-08-04"
workers_dev = true
keep_vars = true

[secrets]
required = [
  "DISCORD_PUBLIC_KEY",
  "DISCORD_TOKEN",
  "DISCORD_CHANNEL_ID",
  "PALWORLD_PASSWORD"
]

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "STATE"

[vars]
GAME_PROVIDER = "palworld"
POLLING_ENABLED = "true"
PALWORLD_HOST = "135.148.100.61"
PALWORLD_PORT = "25586"
PALWORLD_USERNAME = "admin"
SERVER_DISPLAY_NAME = "The Tribal Lands"
OFFLINE_FAILURE_THRESHOLD = "2"
STATUS_UPDATE_SECONDS = "60"
